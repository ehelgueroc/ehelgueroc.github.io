# Self-hosted Renovate: runs Renovate in Actions against this repo with renovate.json, instead of the hosted
# Mend app. Renovate's own `schedule` in renovate.json decides when update PRs open; running every 6 hours
# lets security fixes (vulnerabilityAlerts: "at any time") and automerges happen promptly.
#
# Needs the RENOVATE_TOKEN secret: a fine-grained personal access token for this repo only, with
# Read & write on Contents, Pull requests, Issues, Workflows and Commit statuses, and Read on Dependabot alerts.
# A PAT (not GITHUB_TOKEN) is required so Renovate's PRs trigger the CI workflow.
name: Renovate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.232.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false" # renovate.json is already in the repo
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info

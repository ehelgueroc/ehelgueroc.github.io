# Runs the full build on every pull request without deploying: type check, content schemas,
# CV/preview-card/icon generation (headless Chrome), the page-weight budget, then the behaviour tests. Branch protection on main
# requires this "checks" job to pass, so nothing reaches main (and the live site) unchecked.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
      - run: npm test # Playwright + axe against the built site, using the runner's installed Chrome

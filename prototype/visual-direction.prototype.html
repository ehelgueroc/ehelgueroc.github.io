<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "Pick the visual direction".
  Three structurally different looks of the Intro + Timeline, switchable via ?variant=A|B|C
  (bottom bar or ← / → keys). Real content from content/intro.md and content/timeline.md.
  Animations are deliberately absent; they're decided by "Settle animation and expand behaviour".
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Visual direction</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  img { display: block; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  /* ---------- Prototype switcher (not part of any design) ---------- */
  .proto-bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1000;
    display: flex; align-items: center; gap: 4px; padding: 6px;
    background: #ff2d87; color: #fff; border-radius: 999px;
    font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .proto-bar button {
    all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 16px; background: rgba(255,255,255,.18);
  }
  .proto-bar button:hover { background: rgba(255,255,255,.32); }
  .proto-bar span { padding: 0 12px; white-space: nowrap; }

  /* ---------- Variant A: Terminal (dark, mono accents, single column, git-log timeline) ---------- */
  .vA { background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 64px 16px 120px;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .vA .wrap { max-width: 760px; margin: 0 auto; }
  .vA .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .vA .prompt { color: #3fb950; font-size: 14px; margin-bottom: 20px; }
  .vA .prompt b { color: #8b949e; font-weight: 400; }
  .vA .head { display: flex; gap: 24px; align-items: center; }
  .vA .avatar { width: 96px; height: 96px; border-radius: 12px; border: 1px solid #30363d; object-fit: cover;
                background: #161b22; display: grid; place-items: center; color: #3fb950; font-size: 28px; flex: none; }
  .vA h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; color: #f0f6fc; letter-spacing: -0.02em; }
  .vA .title { margin: 6px 0 0; color: #f0f6fc; font-size: 18px; }
  .vA .sub { color: #8b949e; font-size: 14px; margin-top: 4px; }
  .vA .summary { margin: 28px 0 16px; color: #c9d1d9; }
  .vA .meta { color: #8b949e; font-size: 14px; }
  .vA .links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  .vA .links a { color: #58a6ff; text-decoration: none; }
  .vA .links a:hover { text-decoration: underline; }
  .vA h2 { margin: 72px 0 24px; font-size: 14px; color: #3fb950; font-weight: 400; }
  .vA .log { border-left: 2px solid #30363d; margin-left: 7px; }
  .vA .entry { position: relative; padding: 0 0 28px 28px; }
  .vA .entry::before { content: ""; position: absolute; left: -9px; top: 6px; width: 12px; height: 12px;
                       border-radius: 50%; background: #0d1117; border: 2px solid #3fb950; }
  .vA .years { color: #3fb950; font-size: 13px; }
  .vA .role { color: #f0f6fc; font-weight: 600; font-size: 17px; }
  .vA .role .at { color: #8b949e; font-weight: 400; }
  .vA .one { color: #8b949e; margin: 2px 0 8px; }
  .vA .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .vA .tag { font-size: 12px; color: #79c0ff; background: #161b22; border: 1px solid #30363d; padding: 2px 8px; border-radius: 6px; }
  .vA summary .more { color: #58a6ff; font-size: 13px; margin-top: 8px; display: inline-block; }
  .vA details[open] .more::after { content: " −"; }
  .vA details:not([open]) .more::after { content: " +"; }
  .vA .detail { margin-top: 12px; padding: 12px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; font-size: 15px; }
  .vA .detail ul { margin: 8px 0 0; padding-left: 18px; }
  .vA .detail li { margin: 4px 0; }

  /* ---------- Variant B: Editorial (light, serif, sticky sidebar intro, year-margin rows) ---------- */
  .vB { background: #faf8f5; color: #222; min-height: 100vh; padding: 0 16px 120px;
        font: 17px/1.65 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .vB .grid { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 72px; }
  .vB aside { position: sticky; top: 0; align-self: start; padding-top: 72px; }
  .vB .avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; background: #e9e4dc;
                display: grid; place-items: center; font-size: 34px; color: #b4532a; }
  .vB h1 { font-size: 34px; line-height: 1.15; margin: 24px 0 8px; font-weight: 600; }
  .vB .title { font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #b4532a; }
  .vB .sub { font: 14px/1.5 system-ui, sans-serif; color: #666; margin-top: 8px; }
  .vB .meta { font: 14px/1.7 system-ui, sans-serif; color: #666; margin-top: 24px; padding-top: 24px; border-top: 1px solid #e3ddd3; }
  .vB .links { margin-top: 24px; display: flex; flex-direction: column; gap: 6px; font: 15px system-ui, sans-serif; }
  .vB .links a { color: #222; text-decoration: underline; text-decoration-color: #b4532a; text-underline-offset: 4px; }
  .vB main { padding-top: 72px; }
  .vB .lead { font-size: 24px; line-height: 1.5; margin: 0 0 80px; color: #333; }
  .vB h2 { font: 600 13px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #999; margin: 0 0 8px; }
  .vB .row { display: grid; grid-template-columns: 120px 1fr; gap: 24px; padding: 28px 0; border-top: 1px solid #e3ddd3; }
  .vB .years { font-size: 22px; color: #b4532a; line-height: 1.2; }
  .vB .years small { display: block; font-size: 14px; color: #999; }
  .vB .role { font-size: 21px; font-weight: 600; line-height: 1.3; }
  .vB .role .at { font-weight: 400; font-style: italic; color: #555; }
  .vB .one { color: #555; margin: 6px 0; }
  .vB .tags { font: 12px/1.6 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #888; }
  .vB summary .more { font: 14px system-ui, sans-serif; color: #b4532a; margin-top: 8px; display: inline-block; }
  .vB details[open] .more::after { content: " ↑"; }
  .vB details:not([open]) .more::after { content: " ↓"; }
  .vB .detail { font-size: 16px; margin-top: 12px; }
  .vB .detail .loc { font: 13px system-ui, sans-serif; color: #888; }
  .vB .detail ul { padding-left: 20px; margin: 8px 0 0; }
  .vB .detail li { margin: 6px 0; }
  @media (max-width: 820px) {
    .vB .grid { grid-template-columns: 1fr; gap: 0; }
    .vB aside { position: static; padding-top: 48px; }
    .vB main { padding-top: 48px; }
    .vB .lead { font-size: 20px; margin-bottom: 48px; }
    .vB .row { grid-template-columns: 1fr; gap: 8px; }
  }

  /* ---------- Variant C: Bold (auto light/dark, centred hero, alternating cards on a centre line) ---------- */
  .vC { --bg: #f6f7fb; --fg: #14161f; --muted: #5d6275; --card: #fff; --line: #dfe2ec; --a1: #6d4aff; --a2: #00b3d6;
        background: var(--bg); color: var(--fg); min-height: 100vh; padding: 0 16px 120px;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .vC { --bg: #0e0f16; --fg: #eef0f8; --muted: #9aa0b8; --card: #171925; --line: #2a2d3d; }
  }
  .vC .hero { min-height: 92vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; max-width: 760px; margin: 0 auto; }
  .vC .avatar { width: 152px; height: 152px; border-radius: 50%; object-fit: cover; padding: 4px;
                background: linear-gradient(135deg, var(--a1), var(--a2)); display: grid; place-items: center; color: #fff; font-size: 44px; font-weight: 700; }
  .vC h1 { font-size: clamp(36px, 8vw, 68px); line-height: 1.05; margin: 28px 0 10px; letter-spacing: -0.03em; font-weight: 800; }
  .vC .title { font-size: clamp(18px, 3vw, 22px); font-weight: 700;
               background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .vC .sub { color: var(--muted); margin-top: 6px; }
  .vC .summary { color: var(--muted); margin: 24px 0 0; font-size: 17px; }
  .vC .meta { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .vC .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
  .vC .links a { text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: var(--card); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .vC .links a:first-child { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #fff; border: 0; }
  .vC h2 { text-align: center; font-size: 32px; letter-spacing: -0.02em; margin: 40px 0 48px; }
  .vC .tl { position: relative; max-width: 1000px; margin: 0 auto; }
  .vC .tl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%);
                    background: linear-gradient(var(--a1), var(--a2)); border-radius: 3px; }
  .vC .item { position: relative; width: 50%; padding: 0 40px 40px 0; }
  .vC .item:nth-child(even) { margin-left: 50%; padding: 0 0 40px 40px; }
  .vC .item::after { content: ""; position: absolute; top: 22px; right: -9px; width: 18px; height: 18px; border-radius: 50%;
                     background: var(--bg); border: 3px solid var(--a1); }
  .vC .item:nth-child(even)::after { left: -9px; right: auto; }
  .vC .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; box-shadow: 0 8px 28px rgba(20,22,40,.06); }
  .vC .years { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--a1), var(--a2)); padding: 3px 10px; border-radius: 999px; }
  .vC .role { font-size: 19px; font-weight: 750; margin-top: 10px; line-height: 1.3; }
  .vC .role .at { display: block; font-size: 15px; font-weight: 500; color: var(--muted); }
  .vC .one { color: var(--muted); margin: 8px 0 12px; font-size: 15px; }
  .vC .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .vC .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--a1) 14%, transparent); color: var(--a1); }
  .vC summary .more { display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--a1); }
  .vC details[open] .more::after { content: " ▲"; font-size: 10px; }
  .vC details:not([open]) .more::after { content: " ▼"; font-size: 10px; }
  .vC .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; }
  .vC .detail .loc { color: var(--muted); font-size: 13px; }
  .vC .detail ul { padding-left: 18px; margin: 8px 0 0; }
  @media (max-width: 760px) {
    .vC .tl::before { left: 8px; transform: none; }
    .vC .item, .vC .item:nth-child(even) { width: 100%; margin-left: 0; padding: 0 0 28px 36px; }
    .vC .item::after, .vC .item:nth-child(even)::after { left: 0; right: auto; }
  }
</style>
</head>
<body>
<div id="app"></div>
<nav class="proto-bar" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
</nav>
<script>
// ---------- Content (copied from content/intro.md + content/timeline.md) ----------
const intro = {
  name: "Esteban Helguero Cardiff",
  title: "Senior Backend Engineer",
  sub: "Node.js · TypeScript · AWS · Platform & DevOps tooling",
  summary: "Backend engineer with 15+ years of experience, these days building Node.js and TypeScript services on AWS. Lately I've moved into platform work: automating dependency updates across 40 repositories, building shared CI pipes, and bringing Kafka and Schema Registry to teams with Confluent and Terraform. What I enjoy most is making other developers' lives easier: fewer manual steps, fewer deploy surprises, and tools people actually want to use.",
  location: "Gran Canaria, Spain · Remote",
  languages: "Spanish (native) · English (professional) · German (basic)",
  links: [
    ["LinkedIn", "https://www.linkedin.com/in/ehelguero"],
    ["GitHub", "https://github.com/ehelgueroc"],
    ["Email", "mailto:e.helguero.c@gmail.com"],
  ],
  photo: "../content/photo.jpg",
};
const entries = [
  { years: "2023 – Present", title: "Senior Node.js Backend Developer", company: "rindus",
    summary: "Backend services and platform tooling for C&A, on the rindus team.",
    tags: ["TypeScript", "NestJS", "AWS", "Terraform", "Kafka"], location: "Gran Canaria, Spain (remote)",
    bullets: [
      "Build NestJS/TypeScript services on PostgreSQL and DynamoDB, deployed to AWS (ECS, Fargate, S3) with Terraform and monitored in Datadog.",
      "Own the internal Renovate setup: a scheduled pipeline that keeps dependencies up to date across 40 repositories and several teams, with Dependency-Track used to make sure vulnerable dependencies keep going down.",
      "Built shared Bitbucket pipes for AI-assisted code review, SonarQube and Renovate, so teams can adopt them without setting anything up from scratch.",
      "Building a Kafka Schema Registry and supporting developers who manage Confluent resources with Terraform.",
      "Run the monthly DevOps Talk Show, where the team presents what it has shipped, including my own pipes and Terraform templates.",
    ] },
  { years: "2022 – 2023", title: "Fullstack Node.js Developer", company: "Secret Source",
    summary: "Full-stack TypeScript work for a UK client.",
    tags: ["TypeScript", "React", "Node.js", "Express", "MySQL"], location: "Las Palmas de Gran Canaria, Spain",
    bullets: [
      "Built frontend features in React and TypeScript with Redux Toolkit and Styled Components, and documented components in Storybook.",
      "Wrote backend APIs in Express and TypeScript on MySQL, including stored procedures.",
      "Integrated Auth0 for authentication and the Squidex headless CMS.",
    ] },
  { years: "2017 – 2022", title: "Senior Developer", company: "redk – The CRM solutions company",
    summary: "CRM integrations and AWS serverless backends.",
    tags: ["AWS Lambda", "Node.js", "PHP", "SugarCRM", "Zendesk"], location: "Madrid, Spain",
    bullets: [
      "Built serverless backends on AWS Lambda, API Gateway and DynamoDB, plus Node.js services.",
      "Certified SugarCRM Developer Specialist: full-stack work on SugarCRM v6–v8 (PHP, JavaScript, MySQL, Talend, PHPUnit).",
      "Zendesk Certified Developer: third-party integrations and Help Center frontend development.",
      "Served as Scrum Master for the team.",
    ] },
  { years: "2016 – 2017", title: "Fullstack Developer", company: "Coolcan Ideas Canarias",
    summary: "Full-stack web application development.",
    tags: ["PHP", "CodeIgniter", "MySQL", "JavaScript"], location: "Las Palmas, Spain",
    bullets: ["Built web applications end to end: PHP/CodeIgniter and MySQL on the backend, HTML, CSS and JavaScript on the frontend."] },
  { years: "2015 – 2016", title: "Senior Web Application Developer", company: "Open Canarias",
    summary: "Features and performance work on travel and activities web apps.",
    tags: ["PHP", "CodeIgniter", "MySQL", "JavaScript"], location: "Las Palmas, Spain",
    bullets: [
      "Developed features and fixed bugs on a hotel room comparison app, and sped up its hotel-data scraping in the first months.",
      "Built features for a multi-tenant activities app and made the whole app responsive.",
    ] },
  { years: "2005 – 2015", title: "Early career", company: "Web developer & IT technician",
    summary: "Ten years of web development and IT operations in the Canary Islands, much of it at Fuerteventura Airport.",
    tags: ["PHP", "HTML/CSS", "JavaScript", "SharePoint"], location: "Fuerteventura & Gran Canaria, Spain",
    bullets: [
      "Designed, built and coded web applications in PHP, HTML5 and CSS3 (SPI Fuerteventura, Samtec, Destinum Networks).",
      "Developed and maintained internal web apps for Fuerteventura Airport departments in PHP and SharePoint, and kept servers, backups and workstations running, including 24-hour on-call support (Bull, Indra, INERZA).",
      "Started out building a client-management application and maintaining IT systems for the Fuerteventura business confederation.",
    ] },
];

// ---------- Helpers ----------
const avatar = (cls = "avatar") =>
  `<img class="${cls}" src="${intro.photo}" alt="${intro.name}"
        onerror="this.outerHTML='<div class=&quot;${cls}&quot;>EH</div>'">`;
const links = (fmt = (l) => l) =>
  intro.links.map(([t, h]) => `<a href="${h}" target="_blank" rel="noopener">${fmt(t)}</a>`).join("");
const bullets = (e) => `<ul>${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`;

// ---------- Variants ----------
const variants = {
  A: { name: "Terminal", render: () => `
    <div class="vA"><div class="wrap">
      <div class="prompt mono">~/ehelguero <b>$</b> whoami</div>
      <div class="head">${avatar()}<div>
        <h1>${intro.name}</h1>
        <p class="title">${intro.title}</p>
        <div class="sub mono">${intro.sub}</div>
      </div></div>
      <p class="summary">${intro.summary}</p>
      <div class="meta mono">${intro.location}<br>${intro.languages}</div>
      <div class="links mono">${links((t) => `[${t.toLowerCase()}]`)}</div>
      <h2 class="mono">$ git log --career</h2>
      <div class="log">${entries.map((e) => `
        <div class="entry"><details><summary>
          <div class="years mono">${e.years}</div>
          <div class="role">${e.title} <span class="at">@ ${e.company}</span></div>
          <div class="one">${e.summary}</div>
          <div class="tags">${e.tags.map((t) => `<span class="tag mono">${t}</span>`).join("")}</div>
          <span class="more mono">details</span>
        </summary><div class="detail"><div class="meta mono">${e.location}</div>${bullets(e)}</div></details></div>`).join("")}
      </div>
    </div></div>` },

  B: { name: "Editorial", render: () => `
    <div class="vB"><div class="grid">
      <aside>
        ${avatar()}
        <h1>${intro.name}</h1>
        <div class="title">${intro.title}</div>
        <div class="sub">${intro.sub}</div>
        <div class="meta">${intro.location}<br>${intro.languages}</div>
        <div class="links">${links()}</div>
      </aside>
      <main>
        <p class="lead">${intro.summary}</p>
        <h2>Experience</h2>
        ${entries.map((e) => {
          const [from, to] = e.years.split(" – ");
          return `
          <div class="row">
            <div class="years">${from}<small>to ${to}</small></div>
            <details><summary>
              <div class="role">${e.title}, <span class="at">${e.company}</span></div>
              <div class="one">${e.summary}</div>
              <div class="tags">${e.tags.join(" · ")}</div>
              <span class="more">Read more</span>
            </summary><div class="detail"><div class="loc">${e.location}</div>${bullets(e)}</div></details>
          </div>`; }).join("")}
      </main>
    </div></div>` },

  C: { name: "Bold (auto light/dark)", render: () => `
    <div class="vC">
      <section class="hero">
        ${avatar()}
        <h1>${intro.name}</h1>
        <div class="title">${intro.title}</div>
        <div class="sub">${intro.sub}</div>
        <p class="summary">${intro.summary}</p>
        <div class="meta">${intro.location} &nbsp;·&nbsp; ${intro.languages}</div>
        <div class="links">${links()}</div>
      </section>
      <h2>Career</h2>
      <div class="tl">${entries.map((e) => `
        <div class="item"><div class="card"><details><summary>
          <span class="years">${e.years}</span>
          <div class="role">${e.title}<span class="at">${e.company}</span></div>
          <div class="one">${e.summary}</div>
          <div class="tags">${e.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
          <span class="more">Details</span>
        </summary><div class="detail"><div class="loc">${e.location}</div>${bullets(e)}</div></details></div></div>`).join("")}
      </div>
    </div>` },
};

// ---------- Switcher ----------
const keys = Object.keys(variants);
function show(key) {
  if (!variants[key]) key = "C";
  document.getElementById("app").innerHTML = variants[key].render();
  document.getElementById("label").textContent = `${key} (${variants[key].name})`;
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  window.scrollTo(0, 0);
}
function step(d) {
  const cur = new URL(location.href).searchParams.get("variant") || "C";
  const i = (keys.indexOf(cur) + d + keys.length) % keys.length;
  show(keys[i]);
}
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
show(new URL(location.href).searchParams.get("variant") || "C");
</script>
</body>
</html>
